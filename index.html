<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Valle de Lázar — Mapa interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  :root{
    --umber:#110b07; --umber-2:#1c140e; --bone:#bdb69c; --line:#43392c;
    --parch:#cbc4aa; --ink:#110b07; --oxblood:#c4553a; --lime:#c8f56b;
    --blackletter:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--umber);color:var(--parch);
    font-family:"EB Garamond",Garamond,Georgia,serif;font-size:17px;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font:inherit;color:inherit}
  [hidden]{display:none!important}

  /* ---------- header ---------- */
  header{position:fixed;inset:0 0 auto 0;height:52px;z-index:30;display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none;
    padding:0 12px;background:var(--umber);border-bottom:1px solid var(--line)}
  body.editing header{border-bottom-color:var(--bone);box-shadow:0 2px 0 var(--lime)}
  h1{margin:0;font-family:var(--blackletter);font-size:28px;font-weight:normal;letter-spacing:.01em;white-space:nowrap;color:var(--parch)}
  .spacer{flex:1}
  .btn{background:transparent;border:1px solid var(--line);border-radius:3px;padding:6px 11px;cursor:pointer;
    font-size:15px;white-space:nowrap}
  .btn:hover{border-color:var(--bone);background:rgba(189,182,156,.12)}
  .btn.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
  .btn:focus-visible,.chip:focus-visible,.zoom button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
  #search{width:200px;background:var(--umber-2);border:1px solid var(--line);border-radius:3px;padding:6px 10px;font-size:15px}
  #search::placeholder{color:#7d7460}
  .searchwrap{position:relative}
  #results{position:fixed;z-index:45;background:var(--umber-2);border:1px solid var(--line);
    max-height:260px;overflow:auto;border-radius:3px}
  #results button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 10px;cursor:pointer;font-size:15px}
  #results button:hover,#results button:focus-visible{background:rgba(189,182,156,.16);outline:none}
  .menuwrap{position:relative}
  #menu,#layersMenu{position:fixed;z-index:45;min-width:210px;background:var(--umber-2);border:1px solid var(--line);border-radius:3px;padding:4px;z-index:40}
  #menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;cursor:pointer;font-size:15px;border-radius:2px}
  #menu button:hover{background:rgba(189,182,156,.16)}

  /* ---------- map ---------- */
  #viewport{position:fixed;inset:52px 0 56px 0;overflow:hidden;background:#0f0a06;touch-action:none;cursor:grab}
  #viewport.dragging{cursor:grabbing}
  #viewport.placing{cursor:crosshair}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #world.anim{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
  #map{display:block;max-width:none;pointer-events:none;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
  #viewport,#world{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #markers{position:absolute;inset:0;pointer-events:none}

  .marker{position:absolute;width:0;height:0}
  .marker.hidden{display:none}
  .pin{position:absolute;left:-12.5px;top:-29px;width:25px;height:25px;border-radius:50%;background:var(--c);
    border:2px solid #f6ead0;display:grid;place-items:center;pointer-events:auto;cursor:pointer;
    transform:scale(var(--inv,1));transform-origin:12.5px 29px;box-shadow:0 2px 4px rgba(0,0,0,.45)}
  .pin::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--c);border-bottom:0}
  .pin svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  body.editing .pin{cursor:move}
  .marker.sel{z-index:99999!important}
  .marker.sel .pin{box-shadow:0 0 0 2.5px var(--lime),0 0 12px 3px rgba(200,245,107,.55)}
  .lbl{position:absolute;left:0;top:5px;transform:translateX(-50%) scale(var(--inv,1));transform-origin:50% 0;
    white-space:nowrap;pointer-events:none;font-size:13.5px;font-weight:600;color:#1d130a;
    text-shadow:0 0 2px #f1e2c3,0 0 3px #f1e2c3,0 0 5px #f1e2c3,0 0 7px #f1e2c3}
  .lbl:empty{display:none}
  #markers.nolabels .lbl{display:none}
  #markers.nolabels .marker.sel .lbl,#markers.nolabels .marker:hover .lbl{display:block}

  /* ---------- bottom bar ---------- */
  #bar{position:fixed;inset:auto 0 0 0;height:56px;z-index:30;background:var(--umber);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto}
  #hint{font-size:14px;color:#8f876f;white-space:nowrap;font-style:italic;margin-right:4px}
  .chip{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);border-radius:18px;
    padding:4px 12px 4px 4px;cursor:pointer;font-size:15px;white-space:nowrap}
  .chip .dot{width:24px;height:24px;border-radius:50%;background:var(--c);display:grid;place-items:center}
  .chip .dot svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .chip.off{opacity:.38}
  .chip.active{background:var(--bone);color:var(--ink);border-color:var(--bone)}

  /* ---------- zoom ---------- */
  .zoom{position:fixed;right:12px;bottom:70px;z-index:20;display:flex;flex-direction:column;gap:6px}
  .zoom button{width:38px;height:38px;border-radius:3px;border:1px solid var(--line);background:rgba(17,11,7,.92);
    font-size:20px;line-height:1;cursor:pointer}
  .zoom button:hover{border-color:var(--bone)}

  /* ---------- detail panel ---------- */
  #panel{position:fixed;z-index:35;top:64px;left:12px;width:300px;max-height:calc(100% - 140px);overflow:auto;
    background:var(--umber);color:var(--parch);border:1px solid var(--line);border-radius:3px;padding:16px 16px 14px;
    box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #panel h2{margin:0 28px 8px 0;font-family:var(--blackletter);font-weight:normal;font-size:30px;line-height:1.1}
  #panel p{margin:10px 0 0;line-height:1.5;font-size:17px;text-align:justify;hyphens:auto}
  #panel .tag{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:2px 10px 2px 3px;border-radius:14px;background:var(--c);color:#fff}
  #panel .tag .dot{width:18px;height:18px;display:grid;place-items:center}
  #panel .tag svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #panel .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--parch);line-height:1}
  #panel label{display:block;font-size:14px;margin-bottom:10px}
  #panel input,#panel select,#panel textarea{display:block;width:100%;margin-top:3px;padding:7px 8px;background:var(--umber-2);
    border:1px solid var(--line);border-radius:2px;color:var(--parch);font-size:16px}
  #panel textarea{resize:vertical}
  #panel .row{display:flex;gap:8px;justify-content:space-between;margin-top:4px}
  #panel .row button{border:1px solid var(--bone);background:var(--bone);color:var(--umber);padding:7px 14px;font-weight:600;border-radius:2px;cursor:pointer}
  #panel .row button.danger{background:transparent;color:var(--oxblood);border-color:var(--oxblood)}
  @media (max-width:640px){
    h1{font-size:22px}
    #search{width:110px}
    #panel{top:auto;bottom:66px;left:8px;right:8px;width:auto;max-height:46%}
    .zoom{bottom:auto;top:62px}
  }

  /* ---------- toast & drop ---------- */
  #toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--parch);
    border:1px solid var(--bone);padding:9px 16px;border-radius:3px;font-size:15px;display:flex;gap:12px;align-items:center;max-width:90vw}
  #toast button{background:none;border:0;color:var(--bone);cursor:pointer;text-decoration:underline;font-size:15px}
  #drop{position:fixed;inset:52px 0 56px 0;z-index:25;display:grid;place-items:center;text-align:center;padding:20px}
  #drop div{border:2px dashed var(--line);border-radius:6px;padding:36px 40px;max-width:480px}
  #drop p{margin:0 0 14px;line-height:1.5}
  @media (prefers-reduced-motion:reduce){#world.anim{transition:none}}

  #layersMenu label{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer;white-space:nowrap}
  #layersMenu input[type=range]{width:100%;accent-color:var(--bone)}
  #layersMenu .sub{display:block;padding:6px 10px 8px;font-size:14px;color:#8f876f}
  #shapes{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
  #shapes polygon{pointer-events:visiblePainted;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;
    fill-opacity:var(--fo,.35);stroke-opacity:.95}
  #shapes polygon.barony{stroke-width:1.75}
  #shapes polygon.county{stroke-width:3.5}
  #shapes polygon:hover{fill-opacity:calc(var(--fo,.35) + .1)}
  #shapes polygon.sel{stroke:#f4efe0;stroke-width:3;fill-opacity:calc(var(--fo,.35) + .15)}
  #viewport.placing #shapes polygon{pointer-events:none;cursor:inherit}
  #draft{fill:none;stroke:var(--lime);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
  #texts,#handles{position:absolute;inset:0;pointer-events:none}
  .rtext{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));white-space:pre;text-align:center;
    line-height:1.05;font-weight:600;opacity:.88;pointer-events:none}
  body.editing .rtext{pointer-events:auto;cursor:move}
  #viewport.placing .rtext{pointer-events:none}
  .rtext.caps{text-transform:uppercase}
  .rtext.black{font-family:var(--blackletter);font-weight:normal}
  .rtext.c-ink{color:#2b1d10;text-shadow:0 0 6px rgba(241,226,195,.95),0 0 14px rgba(241,226,195,.7)}
  .rtext.c-blood{color:#7d2616;text-shadow:0 0 6px rgba(241,226,195,.95),0 0 14px rgba(241,226,195,.7)}
  .rtext.c-light{color:#f1e2c3;text-shadow:0 0 6px rgba(17,11,7,.95),0 0 14px rgba(17,11,7,.7)}
  .rtext.sel{outline:2px dashed var(--lime);outline-offset:6px}
  .vtx{position:absolute;width:0;height:0}
  .vtx i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--lime);
    border:2px solid #111;transform:scale(var(--inv,1));pointer-events:auto;cursor:move;display:block}
  .vtx.first i{width:16px;height:16px;left:-8px;top:-8px;background:#fff;cursor:pointer}
  .vtx.d:not(.first) i{pointer-events:none;cursor:default}
  #drawbar{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:32;display:flex;gap:8px;
    background:var(--umber);border:1px solid var(--lime);padding:6px 8px;border-radius:3px}
  #drawbar .btn{padding:4px 10px}
  .chip.tool{padding:4px 14px}
  .sep{width:1px;height:26px;background:var(--line);flex:none;margin:0 4px}
  .sws{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
  .sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
  .sw.on{border-color:#fff}
  #panel small{display:block;margin:0 0 10px;color:#8f876f;font-size:14px}
  #panel input[type=range]{padding:0;accent-color:var(--bone)}
  #panel .holder{margin:8px 0 0;font-size:16px;color:var(--lime)}

  header::-webkit-scrollbar{display:none}
  header>*{flex:none}
  .datebox{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--parch);flex-wrap:wrap}
  .datebox>span{color:#8f876f;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
  .datebox label{display:flex;align-items:center;gap:5px;margin:0!important;font-size:14px}
  .datebox input{width:64px;padding:3px 6px;background:var(--umber-2);border:1px solid var(--line);border-radius:2px;color:var(--parch)}
  .datebox.hdr{white-space:nowrap}
  @media (max-width:1100px){.datebox.hdr{display:none}}
  #sheetWrap{position:fixed;inset:0;z-index:50;background:rgba(5,3,1,.74);overflow:auto;padding:60px 12px 28px;
    display:flex;justify-content:center;align-items:flex-start}
  #sheet{position:relative;width:100%;max-width:640px;background:var(--umber);border:1px solid var(--line);
    box-shadow:0 0 0 4px var(--umber),0 0 0 5px var(--line),0 24px 60px rgba(0,0,0,.7);padding:24px 26px 22px}
  #sheet h2{margin:0;font-family:var(--blackletter);font-weight:normal;font-size:40px;line-height:1.05;color:var(--parch);padding-right:36px}
  #sheet .sub{margin-top:6px;font-size:18px;color:var(--bone);font-style:italic}
  #sheet h3{margin:20px 0 8px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone);
    font-weight:600;border-bottom:1px solid var(--line);padding-bottom:5px}
  #sheet p{margin:0;line-height:1.55;font-size:17px;text-align:justify;hyphens:auto}
  #sheet .x{position:absolute;right:12px;top:8px;border:0;background:none;font-size:28px;cursor:pointer;color:var(--parch);line-height:1}
  #sheet .sh-back{position:absolute;right:46px;top:12px;background:none;border:1px solid var(--line);color:var(--parch);
    border-radius:3px;padding:3px 10px;cursor:pointer;font-size:14px}
  .sh-top{display:flex;gap:16px;align-items:flex-start}
  .sh-top img{width:96px;height:120px;object-fit:cover;border:1px solid var(--line);flex:none}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:18px 0 4px}
  .stat{background:var(--umber-2);border:1px solid var(--line);text-align:center;padding:10px 6px}
  .stat span{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8f876f}
  .stat b{display:block;font-size:18px;font-weight:500;margin-top:5px;line-height:1.2}
  .rl,.rg,.rk{color:var(--lime);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
  .pills{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:17px}
  #sheet label{display:block;font-size:14px;margin-bottom:10px}
  #sheet input:not([type=checkbox]),#sheet select,#sheet textarea{display:block;width:100%;margin-top:3px;padding:7px 8px;
    background:var(--umber-2);border:1px solid var(--line);border-radius:2px;color:var(--parch);font-size:16px}
  #sheet label.chk{display:flex;gap:8px;align-items:center;font-size:16px}
  .grid3{display:grid;grid-template-columns:90px 1fr 76px;gap:8px}
  #sheet .row{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
  #sheet .row button{border:1px solid var(--bone);background:var(--bone);color:var(--umber);padding:7px 14px;border-radius:2px;cursor:pointer;font-weight:600}
  #sheet .row button.danger{background:transparent;color:var(--oxblood);border-color:var(--oxblood)}
  #sheet .datebox{margin:12px 0}
  #sheet .agebox{margin:6px 0 12px}
  .rrow{display:grid;grid-template-columns:1.2fr 1fr auto;gap:10px;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;font-size:17px}
  .rrow:hover{background:rgba(189,182,156,.1)}
  .rrow span{color:#8f876f}.rrow em{color:var(--bone)}
  .rrow small{display:block;color:#8f876f;font-size:14px;line-height:1.2}
  .flt{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  #sheet .flt select,#sheet .flt input{margin:0;width:auto;flex:1 1 150px;padding:6px 8px;font-size:15px}
  .fcount{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:#8f876f;font-size:14px;margin:6px 0 4px;min-height:30px}
  .fcount .btn{padding:2px 10px;font-size:14px}
  #sheet .empty{color:#8f876f;padding:14px 4px}

  #panel a.forum{display:inline-block;margin-top:12px;padding:6px 12px;border:1px solid var(--bone);border-radius:3px;
    color:var(--parch);text-decoration:none;font-size:15px}
  #panel a.forum:hover{background:rgba(189,182,156,.15)}
  #sheet.wide{max-width:940px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .fam>div{display:flex;gap:12px;padding:4px 0;align-items:baseline}
  .fam>div>span{width:104px;flex:none;color:#8f876f;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .treebtn{margin-top:12px}
  .treewrap{overflow:auto;margin-top:18px;padding-bottom:6px}
  .tree{position:relative;min-width:max-content;padding:6px 8px}
  .trow{position:relative;display:flex;justify-content:center;gap:26px;margin-bottom:52px}
  .trow:last-child{margin-bottom:0}
  .tn{width:136px;flex:none;position:relative;z-index:1;background:var(--umber-2);border:1px solid var(--line);color:var(--parch);
    padding:8px 6px;text-align:center;cursor:pointer;border-radius:2px;font:inherit}
  .tn b{display:block;font-weight:600;font-size:16px;line-height:1.15}
  .tn span{display:block;font-size:13px;color:#8f876f;min-height:1.1em}
  .tn em{display:block;font-size:13px;color:var(--bone)}
  .tn:hover{border-color:var(--bone)}
  .tn.focus{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime)}
  .tn.dead b{font-style:italic}
  #treeSvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
  #treeSvg path{fill:none;stroke-width:2}
  #treeSvg .desc{stroke:#7d7460}
  #treeSvg .marr{stroke:#d9cfae;stroke-width:3}
  .zoom button{display:grid;place-items:center;padding:0}
  #zIn,#zOut{font-size:20px}

  .datebox select{max-width:200px;padding:3px 6px;background:var(--umber-2);border:1px solid var(--line);border-radius:2px;color:var(--parch);font:inherit;font-size:14px}
  .datebox .mnote{flex-basis:100%;color:#8f876f;font-size:14px;font-style:italic}
  @media (max-width:1350px){body.editing .datebox.hdr{display:none}}
  #shapes .rt-halo,#shapes .rt{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
  #shapes .rt-halo{stroke:rgba(244,236,214,.85);stroke-width:6}
  #shapes .rt{stroke-width:3}
  #shapes .rt.sel{stroke-width:5}
  #shapes .rt-hit{fill:none;stroke:transparent;stroke-width:16;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:pointer}
  #viewport.placing #shapes .rt-hit{pointer-events:none}

  .savestate{font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:12px;white-space:nowrap;color:#8f876f}
  .savestate.dirty{color:#f0a97d;border-color:#f0a97d}
  #sheet a.forum{display:inline-block;margin-top:14px;padding:6px 12px;border:1px solid var(--bone);border-radius:3px;color:var(--parch);text-decoration:none;font-size:15px}
  .tabs{display:flex;gap:6px;margin:12px 0 4px}
  .tab{background:none;border:1px solid var(--line);color:var(--parch);padding:5px 16px;border-radius:3px;cursor:pointer;font:inherit;font-size:15px}
  .tab.on{background:var(--bone);color:var(--umber);border-color:var(--bone)}
  .tlbar{display:flex;gap:8px;margin:10px 0 6px;flex-wrap:wrap}
  .tlbar input{flex:1 1 160px}.tlbar select{flex:0 1 200px}
  #sheet .tlbar input,#sheet .tlbar select{margin-top:0}
  .evc{border-left:3px solid var(--c,#7d7460);padding:6px 0 8px 14px;margin:0 0 12px}
  .evc.hl{background:rgba(200,245,107,.08)}
  .evc .evh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:#8f876f}
  .evc h4{margin:2px 0 4px;font-size:20px;font-weight:600}
  .badge{background:var(--c,#667085);color:#fff;border-radius:10px;padding:1px 9px;font-size:12px;letter-spacing:.05em}
  .evc p{margin:6px 0 0}
  .evc .evp{margin-top:4px;font-size:15px}
  .evc .btn{margin-top:8px;padding:3px 10px}
  .evs{margin-top:10px;font-size:15px}
  .evs i{color:#8f876f}
  .evs a.ev{display:block;color:var(--lime);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;margin-top:3px}
  .bk{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 2px}
  .bk small{display:block;color:#8f876f;margin:2px 0 0}
  .bk button{border:1px solid var(--bone);background:none;color:var(--parch);padding:4px 12px;border-radius:3px;cursor:pointer;font:inherit}
  #sheet .datebox label{display:flex;align-items:center;gap:6px;margin:0}
  #sheet .datebox input:not([type=checkbox]),#sheet .datebox select{display:inline-block;width:auto;margin:0;padding:4px 6px;font-size:15px}
  #sheet .datebox input[data-k=y],#sheet .datebox input[data-k=d]{width:74px}
  .rk{text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
</style>
</head>
<body>

<header>

</div>

    <p>Suelta una imagen aquí o elige una.</p>

<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept="application/json,.json" hidden>

<script>
/* =========================================================
   SETTINGS — change these
   ========================================================= */
const CONFIG = {
  title:   'Valle de Lázar',
  image:   'map.png',          // map image, same folder as index.html
  markers: 'markers.json',     // published markers, same folder
  editable: false,              // set to false in the build you publish
  storageKey: 'valle-de-lazar-draft-v1',
  calendar: {y:488, m:4, d:1},  // starting "current date" (12 months of 31 days); editable in Edit mode
  monthNames: ['Luna de la Siembra','Luna del Brote','Luna del Cordero','Luna del Sol Alto','Luna del Sudor','Luna de la Cosecha Temprana',
               'Luna de la Pira','Luna del Silencio','Luna de la Última Cosecha','Luna del Cuervo','Luna de los Difuntos','Luna de la Vigilia'],
  monthNotes: ['Comienza el ciclo agrícola; bendición de los campos','Florecen los árboles; celebraciones de renacimiento',
               'Nacen los animales jóvenes; ritos pastoriles','Calor creciente; preparación para la cosecha','Trabajo arduo en los campos; escasez de agua',
               'Primeros frutos; agradecimientos','Festividades de fuego; sacrificios, procesiones nocturnas','Tiempo de augurios, recogimiento; presencia de lo sagrado',
               'Recogida final antes de los fríos','Los cuervos anuncian la decadencia del año','Muerte, descanso, culto a los muertos','Espera del renacer; penitencia y sueños proféticos']
};

/* Marker types: add, remove or recolour freely. Icons are 24x24 stroke paths. */
const TYPES = {
  city:     {label:'Ciudad',     color:'#a8331f', icon:'<path d="M4 21V11l5-3v13M9 21V5l6-2v18M15 21v-9l5 2v7M3 21h18"/>'},
  town:     {label:'Villa',     color:'#b9692a', icon:'<path d="M3 21V12l5-4 5 4v9M13 21v-7l4-3 4 3v10M6 21v-5h4v5"/>'},
  village:  {label:'Aldea',  color:'#6f7f3a', icon:'<path d="M3 12l9-8 9 8M5 10v10h14V10M10 20v-5h4v5"/>'},
  manor:    {label:'Casa señorial', color:'#8c4f5e', icon:'<path d="M3 21h18M4 21V11l8-6 8 6v10M16 8V4.5h2.5V10M10 21v-5h4v5M7 14h1.5M15.5 14H17"/>'},
  castle:   {label:'Castillo',   color:'#5b3a8c', icon:'<path d="M7 21V10h10v11M5 10h14M9 10V7h6v3M12 7V3l4 1.5L12 6M10 21v-4h4v4"/>'},
  fortress: {label:'Fortaleza', color:'#4b5563', icon:'<path d="M3 21V9h3V6h3v3h6V6h3v3h3v12zM9 21v-6a3 3 0 0 1 6 0v6"/>'},
  tower:    {label:'Torre',    color:'#37699a', icon:'<path d="M8 21l1-11h6l1 11M7 10h10L16 5H8zM11 15h2v3h-2z"/>'},
  port:     {label:'Puerto',     color:'#1f7a7a', icon:'<circle cx="12" cy="5" r="2"/><path d="M12 7v14M7 12h10M5 14a7 7 0 0 0 14 0"/>'},
  temple:   {label:'Templo',   color:'#a08320', icon:'<path d="M3 9l9-5 9 5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>'},
  mine:     {label:'Mina',     color:'#6b4a2f', icon:'<path d="M5 8c4-3.5 10-3.5 14 0M12 5.5V21M9 21h6"/>'},
  cave:     {label:'Cueva',     color:'#3d3d4a', icon:'<path d="M3 21c0-8 4-14 9-14s9 6 9 14M8 21c0-4 1.8-7 4-7s4 3 4 7"/>'},
  camp:     {label:'Campamento',     color:'#a1553a', icon:'<path d="M2 20L12 5l10 15zM12 5v15M9 20l3-6 3 6"/>'},
  ruins:    {label:'Ruinas',    color:'#7a7466', icon:'<path d="M5 21h14M8 21V9h3M16 21v-7l-2-2M12 21v-4"/>'},
  landmark: {label:'Lugar notable', color:'#c0821a', icon:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'}
};

/* =========================================================
   Helpers & state
   ========================================================= */
const $ = s => document.querySelector(s);
const svg = p => `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

const vp = $('#viewport'), world = $('#world'), mapImg = $('#map'), layer = $('#markers');
const panel = $('#panel'), bar = $('#bar'), hint = $('#hint');

let iw = 1, ih = 1;                 // natural image size
let view = {x:0, y:0, s:1}, fitS = 1;
let markers = [];                   // {id,name,type,desc,x,y}  x,y are 0..1 of the image
let regions = [];                   // {id,layer:"barony"|"county",name,holder,desc,color,points:[[x,y],..]}
let labels = [];                    // {id,text,style,color,size,rot,spacing,x,y}
let rulers = [];
let routes = [];                    // rutas comerciales: {id,name,status,goods,desc,url,points:[[x,y],..]}                    // personajes: {id,name,title,house,birth,dead,death,liege,portrait,powers,rumors,notes}
let cal = {...CONFIG.calendar};     // current in-world date {y,m,d}
let selected = null, editing = false, tool = null, labelsOn = true;
const hidden = new Set();
let lastDeleted = null;

document.title = CONFIG.title + ' — Interactive Map';
$('#title').textContent = CONFIG.title;
if (!CONFIG.editable){ $('#btnEdit').hidden = true; $('#btnMenu').parentElement.hidden = true; }
let houses = [], events = [];       // casas {id,name,motto,seat,head,desc,url}; eventos {id,title,kind,date,place,desc,url}

/* =========================================================
   Pan / zoom
   ========================================================= */
function applyView(){
  const r = vp.getBoundingClientRect();
  const m = 80; // keep some map on screen
  view.x = clamp(view.x, m - iw*view.s, r.width - m);
  view.y = clamp(view.y, m - ih*view.s, r.height - m);
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  world.style.setProperty('--inv', 1/view.s);
}
function fit(){
  const r = vp.getBoundingClientRect();
  fitS = Math.min(r.width/iw, r.height/ih);
  view.s = fitS;
  view.x = (r.width - iw*fitS)/2;
  view.y = (r.height - ih*fitS)/2;
  applyView();
}
function zoomAt(cx, cy, factor){
  const ns = clamp(view.s*factor, fitS*0.6, Math.max(8, fitS*8));
  const k = ns/view.s;
  view.x = cx - (cx - view.x)*k;
  view.y = cy - (cy - view.y)*k;
  view.s = ns;
  applyView();
}
function toMap(clientX, clientY){
  const r = vp.getBoundingClientRect();
  return {x:(clientX - r.left - view.x)/view.s, y:(clientY - r.top - view.y)/view.s};
}
function flyTo(m){
  const r = vp.getBoundingClientRect();
  view.s = Math.max(view.s, fitS*2.2);
  view.x = r.width/2  - m.x*iw*view.s;
  view.y = r.height/2 - m.y*ih*view.s;
  world.classList.add('anim');
  applyView();
  setTimeout(()=>world.classList.remove('anim'), 500);
}

const ptrs = new Map();
let drag = null, pinch = null;

/* stop the browser from starting a native image/file drag or text selection while panning */
vp.addEventListener('dragstart', e => e.preventDefault());
vp.addEventListener('selectstart', e => e.preventDefault());
vp.addEventListener('mousedown', e => { if (!e.target.closest('.pin,.vtx,.rtext')) e.preventDefault(); });
vp.addEventListener('pointerdown', e=>{
  if (e.target.closest('.pin')) return;
  vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1){
    drag = {sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y, moved:false};
  } else if (ptrs.size === 2){
    drag = null;
    const [a,b] = [...ptrs.values()];
    const r = vp.getBoundingClientRect();
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    pinch = {d:Math.hypot(a.x-b.x, a.y-b.y), s:view.s,
             wx:(mx-r.left-view.x)/view.s, wy:(my-r.top-view.y)/view.s};
  }
});
vp.addEventListener('pointermove', e=>{
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && ptrs.size >= 2){
    const [a,b] = [...ptrs.values()];
    const r = vp.getBoundingClientRect();
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const ns = clamp(pinch.s*Math.hypot(a.x-b.x, a.y-b.y)/pinch.d, fitS*0.6, Math.max(8, fitS*8));
    view.s = ns;
    view.x = mx - r.left - pinch.wx*ns;
    view.y = my - r.top  - pinch.wy*ns;
    applyView();
  } else if (drag){
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx,dy) > 4){ drag.moved = true; vp.classList.add('dragging'); }
    if (drag.moved){ view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }
  }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  const wasClick = drag && !drag.moved && ptrs.size === 1 && e.type === 'pointerup';
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0){ drag = null; vp.classList.remove('dragging'); }
  if (wasClick){
    const p = toMap(e.clientX, e.clientY);
    const inside = p.x>=0 && p.y>=0 && p.x<=iw && p.y<=ih;
    if (editing && tool){
      if (inside){
        if (tool[0] === 'm') addMarker(p.x/iw, p.y/ih, tool.slice(2));
        else if (tool === 't') addLabel(p.x/iw, p.y/ih);
        else addDraftPoint(p.x/iw, p.y/ih);
      }
    } else {
      const h = document.elementFromPoint(e.clientX, e.clientY);
      const sh = h && h.closest && h.closest('#shapes polygon, #shapes .rt-hit');
      select(sh ? sh.dataset.id : null);
    }
  }
}
vp.addEventListener('pointerup', endPtr);
vp.addEventListener('pointercancel', endPtr);
vp.addEventListener('wheel', e=>{
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY*0.0015));
}, {passive:false});
window.addEventListener('resize', applyView);

$('#zIn').onclick  = ()=>{const r=vp.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.4);};
$('#zOut').onclick = ()=>{const r=vp.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1/1.4);};
$('#zFit').onclick = fit;

/* =========================================================
   Markers
   ========================================================= */
function makeEl(m){
  const t = TYPES[m.type] || TYPES.landmark;
  const el = document.createElement('div');
  el.className = 'marker';
  el.dataset.id = m.id;
  el.style.setProperty('--c', t.color);
  el.innerHTML = `<div class="pin" role="button" tabindex="0">${svg(t.icon)}</div><div class="lbl"></div>`;
  el.querySelector('.lbl').textContent = m.name;
  el.querySelector('.pin').setAttribute('aria-label', `${m.name} (${t.label})`);
  placeEl(el, m);

  const pin = el.querySelector('.pin');
  let dm = null;
  pin.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    pin.setPointerCapture(e.pointerId);
    dm = {sx:e.clientX, sy:e.clientY, moved:false};
  });
  pin.addEventListener('pointermove', e=>{
    if (!dm) return;
    if (!dm.moved && Math.hypot(e.clientX-dm.sx, e.clientY-dm.sy) > 5) dm.moved = editing;
    if (dm.moved){
      const p = toMap(e.clientX, e.clientY);
      m.x = clamp(p.x/iw, 0, 1); m.y = clamp(p.y/ih, 0, 1);
      placeEl(el, m);
    }
  });
  pin.addEventListener('pointerup', ()=>{
    if (!dm) return;
    if (dm.moved) save(); else select(m.id);
    dm = null;
  });
  pin.addEventListener('keydown', e=>{ if (e.key==='Enter' || e.key===' '){ e.preventDefault(); select(m.id); }});
  return el;
}
function placeEl(el, m){
  el.style.left = (m.x*iw)+'px';
  el.style.top  = (m.y*ih)+'px';
  el.style.zIndex = Math.round(m.y*10000);
}
function renderMarkers(){
  layer.innerHTML = '';
  markers.forEach(m => layer.appendChild(makeEl(m)));
  refreshUI();
  markSelected();
}
function elOf(id){ return layer.querySelector(`.marker[data-id="${CSS.escape(id)}"]`); }
function get(id){ return markers.find(m => m.id === id); }
function markSelected(){
  world.querySelectorAll('.sel').forEach(el => el.classList.remove('sel'));
  if (selected) world.querySelectorAll(`[data-id="${CSS.escape(selected)}"]`).forEach(el => el.classList.add('sel'));
  renderHandles();
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function renderAll(){ renderRegions(); renderLabels(); renderMarkers(); applyLayers(); }
function findAny(id){
  for (const [kind,arr] of [['marker',markers],['region',regions],['route',routes],['label',labels]]){
    const item = arr.find(x => x.id === id);
    if (item) return {kind, item};
  }
  return null;
}

function addMarker(x, y, type){
  const m = {id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
             name:'Sin nombre', type, desc:'', x, y};
  markers.push(m);
  save(); renderMarkers(); select(m.id);
}
function removeItem(id){
  for (const arr of [markers, regions, routes, labels]){
    const i = arr.findIndex(x => x.id === id);
    if (i < 0) continue;
    lastDeleted = {arr, it:arr[i], i};
    arr.splice(i,1);
    selected = null;
    save(); renderAll(); showPanel();
    toast('Eliminado', 'Deshacer', ()=>{
      if (!lastDeleted) return;
      lastDeleted.arr.splice(lastDeleted.i, 0, lastDeleted.it); lastDeleted = null;
      save(); renderAll();
    });
    return;
  }
}

/* ---------- selection & panel ---------- */
function select(id){
  selected = id;
  markSelected();
  showPanel(true);
}
function typeOptions(cur){
  return Object.entries(TYPES).map(([k,t]) => `<option value="${k}"${k===cur?' selected':''}>${esc(t.label)}</option>`).join('');
}
function showPanel(focus){
  const f = selected && findAny(selected);
  if (!f){ panel.hidden = true; return; }
  if (f.kind === 'region') return regionPanel(f.item, focus);
  if (f.kind === 'route') return routePanel(f.item, focus);
  if (f.kind === 'label') return labelPanel(f.item, focus);
  const m = f.item;
  const t = TYPES[m.type] || TYPES.landmark;
  panel.hidden = false;
  panel.style.setProperty('--c', t.color);
  if (editing){
    panel.innerHTML = `
      <button class="x" id="pClose" aria-label="Cerrar">×</button>
      <label>Nombre<input id="pName" value="${esc(m.name)}" maxlength="80"></label>
      <label>Tipo<select id="pType">${typeOptions(m.type)}</select></label>
      <label>Descripción<textarea id="pDesc" rows="4">${esc(m.desc)}</textarea></label>
      <label>Hilo del foro (enlace, opcional)<input id="pUrl" type="url" value="${esc(m.url || '')}" placeholder="https://carpg.foroactivo.com/t…"></label>
      <div class="row"><button class="danger" id="pDel">Eliminar</button><button id="pDone">Listo</button></div>`;
    $('#pName').oninput = e => { m.name = e.target.value; const el = elOf(m.id); if (el){ el.querySelector('.lbl').textContent = m.name; } save(); };
    $('#pType').onchange = e => { m.type = e.target.value; save(); renderMarkers(); showPanel(); };
    $('#pDesc').oninput = e => { m.desc = e.target.value; save(); };
    $('#pUrl').oninput = e => { m.url = e.target.value.trim(); save(); };
    $('#pDel').onclick = () => removeItem(m.id);
    $('#pDone').onclick = $('#pClose').onclick = () => select(null);
    if (focus){ $('#pName').focus(); $('#pName').select(); }
  } else {
    panel.innerHTML = `
      <button class="x" id="pClose" aria-label="Cerrar">×</button>
      <h2>${esc(m.name)}</h2>
      <span class="tag"><span class="dot">${svg(t.icon)}</span>${esc(t.label)}</span>
      ${residentsHtml(m)}
      ${eventsHtml(m.id)}
      ${m.desc ? `<p>${linkify(m.desc)}</p>` : ''}
      ${forumLink(m.url)}`;
    $('#pClose').onclick = () => select(null);
  }
}

/* ---------- bottom bar: filter (view) / place tool (edit) ---------- */
const isDrawTool = t => !!t && (t.startsWith('r:') || t === 'route');
const HINTS = {
  'route':'Haz clic para trazar la ruta punto por punto. Pulsa «Terminar ruta» o Enter para acabar.',
  'r:county':'Haz clic para trazar el condado. Haz clic en el primer punto, o en «Cerrar figura», para terminar.',
  'r:barony':'Haz clic para trazar la vicaría. Haz clic en el primer punto, o en «Cerrar figura», para terminar.',
  't':'Haz clic donde quieras poner el nombre de la región.'
};
function buildBar(){
  bar.querySelectorAll('.chip,.sep').forEach(c => c.remove());
  if (editing){
    [['r:county','Condado'],['r:barony','Vicaría'],['route','Ruta comercial'],['t','Nombre de región']].forEach(([k,l])=>{
      const b = document.createElement('button');
      b.className = 'chip tool'; b.dataset.tool = k; b.textContent = l;
      b.onclick = ()=>{ cancelDraft(); tool = tool === k ? null : k; refreshUI(); };
      bar.appendChild(b);
    });
    const sp = document.createElement('span'); sp.className = 'sep'; bar.appendChild(sp);
  }
  const used = new Set(markers.map(m => m.type));
  Object.entries(TYPES).forEach(([k,t])=>{
    if (!editing && !used.has(k)) return;
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.type = k; b.dataset.tool = 'm:'+k;
    b.style.setProperty('--c', t.color);
    b.innerHTML = `<span class="dot">${svg(t.icon)}</span>${esc(t.label)}`;
    b.onclick = ()=>{
      if (editing){ cancelDraft(); tool = tool === 'm:'+k ? null : 'm:'+k; }
      else hidden.has(k) ? hidden.delete(k) : hidden.add(k);
      refreshUI();
    };
    bar.appendChild(b);
  });
}
function refreshUI(){

const NS = 'http://www.w3.org/2000/svg';
const PALETTE = ['#b3382c','#d49a2a','#7a8f2e','#2f7d4f','#2a8a8a','#3a6db3','#5b4aa8','#8a4a9c','#c45a86','#8a5a34','#667085','#e8e0c8'];
const LAYER_NAME = {barony:'Vicaría', county:'Condado'};
const shapes = $('#shapes'), handles = $('#handles'), texts = $('#texts');
let draft = [];
const ptsAttr = pts => pts.map(p => `${p[0]*iw},${p[1]*ih}`).join(' ');

function renderRegions(){
  shapes.setAttribute('viewBox', `0 0 ${iw} ${ih}`);
  shapes.setAttribute('width', iw); shapes.setAttribute('height', ih);
  $('#g-county').innerHTML = ''; $('#g-barony').innerHTML = '';
  regions.forEach(r=>{
    const pg = document.createElementNS(NS, 'polygon');
    pg.setAttribute('points', ptsAttr(r.points));
    pg.setAttribute('class', r.layer);
    const col = regionColor(r);
    pg.setAttribute('fill', col); pg.setAttribute('stroke', col);
    pg.dataset.id = r.id;
    const ti = document.createElementNS(NS, 'title'); ti.textContent = r.name; pg.appendChild(ti);
    $('#g-' + (r.layer === 'county' ? 'county' : 'barony')).appendChild(pg);
  });

function vtx(x, y, cls){
  const v = document.createElement('div');
  v.className = 'vtx ' + (cls || '');
  v.style.left = x*iw + 'px'; v.style.top = y*ih + 'px';
  v.innerHTML = '<i></i>';
  handles.appendChild(v);
  return v;
}
function renderHandles(){
  handles.innerHTML = '';
  const dl = $('#draft');
  if (editing && isDrawTool(tool)){
    draft.forEach((p,i)=>{
      const el = vtx(p[0], p[1], 'd' + (i === 0 ? ' first' : '')).firstChild;
      el.addEventListener('pointerdown', e => e.stopPropagation());
      if (i === 0 && tool !== 'route') el.addEventListener('pointerup', e => { e.stopPropagation(); if (draft.length >= 3) finishDraft(); });
    });
    dl.setAttribute('points', ptsAttr(draft));
    return;
  }
  dl.setAttribute('points', '');
  const f = selected && editing && findAny(selected);
  if (!f || (f.kind !== 'region' && f.kind !== 'route')) return;
  const r = f.item;
  r.points.forEach((p,i)=>{
    const v = vtx(p[0], p[1]), el = v.firstChild;
    let dm = null;
    el.addEventListener('pointerdown', e => { e.stopPropagation(); el.setPointerCapture(e.pointerId); dm = {moved:false, sx:e.clientX, sy:e.clientY}; });
    el.addEventListener('pointermove', e => {
      if (!dm) return;
      if (!dm.moved && Math.hypot(e.clientX-dm.sx, e.clientY-dm.sy) > 3) dm.moved = true;
      if (!dm.moved) return;
      const q = toMap(e.clientX, e.clientY);
      p[0] = clamp(q.x/iw, 0, 1); p[1] = clamp(q.y/ih, 0, 1);
      v.style.left = p[0]*iw + 'px'; v.style.top = p[1]*ih + 'px';
      shapes.querySelectorAll(`[data-id="${CSS.escape(r.id)}"]`).forEach(pg => pg.setAttribute('points', ptsAttr(r.points)));
    });
    el.addEventListener('pointerup', e => {
      if (!dm) return;
      if (dm.moved) save();
      else if (e.shiftKey && r.points.length > (f.kind === 'route' ? 2 : 3)){ r.points.splice(i,1); save(); renderRegions(); }
      dm = null;
    });
  });
}
function addDraftPoint(x, y){ draft.push([x,y]); renderHandles(); }
function cancelDraft(){ draft = []; renderHandles(); }
function finishDraft(){
  if (tool === 'route'){
    if (draft.length < 2){ toast('Añade al menos 2 puntos'); return; }
    const c = {id:'c'+uid(), name:'Nueva ruta', status:'abierta', goods:'', desc:'', url:'', points:draft};
    draft = []; routes.push(c); tool = null;
    save(); renderRegions(); refreshUI(); select(c.id); return;
  }
  if (draft.length < 3){ toast('Añade al menos 3 puntos'); return; }
  const k = tool.slice(2);

/* ---------- calendar & characters (fichas) ---------- */
const YEAR_DAYS = 12 * 31;
const toDays = d => d.y*YEAR_DAYS + (d.m-1)*31 + (d.d-1);
const rulerById = id => rulers.find(r => r.id === id);
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const centroid = g => ({x:g.points.reduce((a,p)=>a+p[0],0)/g.points.length, y:g.points.reduce((a,p)=>a+p[1],0)/g.points.length});
function fmtDate(d){
  if (!d) return '—';
  const mn = CONFIG.monthNames[d.m-1];
  return mn ? `${d.d} de ${mn}, año ${d.y}` : `día ${d.d}, mes ${d.m}, año ${d.y}`;
}
function ageInfo(r){
  if (!r.birth) return {text:'—'};
  const end = (r.dead && r.death) ? r.death : cal;
  const diff = toDays(end) - toDays(r.birth);
  if (diff < 0) return {text:'Aún no ha nacido'};
  const y = Math.floor(diff / YEAR_DAYS);
  const t = y === 0 ? 'Menos de 1 año' : y === 1 ? '1 año' : y + ' años';
  return {text: (r.dead && r.death) ? t + ' (al morir)' : t};
}
const nameRe = (name, flags) => new RegExp('(?<![\\p{L}\\p{N}])' + escRe(name.trim()) + '(?![\\p{L}\\p{N}])', flags);

/* Turns text into safe HTML where any character's name becomes a link to their ficha */
function linkify(text){
  text = String(text || '');
  const items = [...rulers.map(r => ({n:r.name.trim(), a:`data-ruler="${esc(r.id)}"`})), ...houses.map(h => ({n:h.name.trim(), a:`data-house="${esc(h.id)}"`}))]
    .filter(x => x.n.length > 1).sort((a,b) => b.n.length - a.n.length);
  let out = '', last = 0;
  if (items.length){
    const re = new RegExp('(?<![\\p{L}\\p{N}])(' + items.map(x => escRe(x.n)).join('|') + ')(?![\\p{L}\\p{N}])', 'giu');
    let m;
    while ((m = re.exec(text))){
      const it = items.find(x => x.n.toLowerCase() === m[1].toLowerCase());
      if (!it) continue;
      out += esc(text.slice(last, m.index)) + `<a class="rl" href="#" ${it.a}>${esc(m[1])}</a>`;
      last = m.index + m[0].length;
    }
  }
  return (out + esc(text.slice(last))).replace(/\n/g, '<br>');
}
const lordshipsOf = r => r.name.trim().length > 1 ? regions.filter(g => nameRe(r.name, 'iu').test(g.holder)) : [];

/* ---------- current date ---------- */
const monthOpts = sel => Array.from({length:12}, (_, i) => `<option value="${i+1}"${i+1 === sel ? ' selected' : ''}>${esc(CONFIG.monthNames[i] || 'Mes ' + (i+1))}</option>`).join('');
const monthNote = m => (CONFIG.monthNotes || [])[m-1] || '';
function renderDateInto(el){
  const hdr = el.classList.contains('hdr');
  if (editing){
    el.innerHTML = `${hdr ? '' : '<span>Fecha actual</span>'}
      <label>Año <input type="number" data-k="y" value="${cal.y}"></label>

      <label>Día <input type="number" data-k="d" min="1" max="31" value="${cal.d}"></label>
      ${hdr ? '' : `<em class="mnote">${esc(monthNote(cal.m))}</em>`}`;
    el.title = '';
    el.querySelectorAll('input,select').forEach(i => i.addEventListener('input', () => {
      const v = parseInt(i.value, 10);

  if (sheetView) sheetStack.push(sheetView);

}

function renderSheet(){
  const v = sheetView; if (!v) return;
  sheet.classList.toggle('wide', v.type === 'tree');
  if (v.type === 'roster') return renderRoster();
  if (v.type === 'houses') return renderHouses();
  if (v.type === 'timeline') return renderTimeline();
  if (v.type === 'backups') return renderBackups();
  if (v.type === 'event'){ const e = events.find(x => x.id === v.id); if (!e){ backSheet(); return; } return renderEventForm(e); }

  const r = rulerById(v.id);

const dateIn = (p, d) => `<div class="grid3">
  <label>Año<input type="number" id="${p}Y" value="${d ? d.y : ''}"></label>
  <label>Mes<select id="${p}M">${monthOpts(d ? d.m : 1)}</select></label>

function readDate(p){
  const y = parseInt($('#'+p+'Y').value, 10);
  if (isNaN(y)) return null;
  return {y, m: clamp(parseInt($('#'+p+'M').value,10) || 1, 1, 12), d: clamp(parseInt($('#'+p+'D').value,10) || 1, 1, 31)};
}
function renderRulerForm(r){

const nameSort = (a,b) => a.name.localeCompare(b.name, 'es');
const roleOf = r => { const l = lordshipsOf(r); return l.some(g => g.layer === 'county') ? 'conde' : l.length ? 'vicario' : 'otro'; };
function regionOpts(){
  const cs = regions.filter(g => g.layer === 'county').sort(nameSort), bs = regions.filter(g => g.layer === 'barony').sort(nameSort);
  return `<option value="">Todas las regiones</option>
    <optgroup label="Condados">${cs.map(g => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</optgroup>
    <optgroup label="Vicarías">${bs.map(g => { const c = parentCounty(g); return `<option value="${esc(g.id)}">${esc(g.name)}${c ? ' — ' + esc(c.name) : ''}</option>`; }).join('')}</optgroup>`;
}
function regionSet(id){
  const g = regions.find(x => x.id === id), S = new Set();
  if (!g) return S;
  S.add(g.id);
  if (g.layer === 'county') regions.filter(b => b.layer === 'barony').forEach(b => { if (b.parent === g.id || (!b.parent && inPoly(centroid(b), g.points))) S.add(b.id); });
  return S;
}
/* people tied to a region: those who hold land in it or live inside it, plus their spouse, parents and children */
function rulerIdsInRegion(regionId){
  const S = regionSet(regionId), polys = [...S].map(id => regions.find(g => g.id === id)).filter(Boolean);
  const lives = r => { const mk = markers.find(m => m.id === r.residence); return !!mk && polys.some(g => inPoly({x:mk.x, y:mk.y}, g.points)); };
  const base = rulers.filter(r => lordshipsOf(r).some(g => S.has(g.id)) || lives(r));
  const ids = new Set(base.map(r => r.id));
  base.forEach(r => { const sp = spouseOf(r); if (sp) ids.add(sp.id); [r.father, r.mother].forEach(x => { if (x) ids.add(x); }); childrenOf(r).forEach(c => ids.add(c.id)); });
  return ids;
}

/* ---------- family ---------- */
const byBirth = (a, b) => (a.birth ? toDays(a.birth) : 1e12) - (b.birth ? toDays(b.birth) : 1e12);
const spouseOf = r => rulerById(r.spouse) || rulers.find(x => x.spouse === r.id) || null;
const childrenOf = r => rulers.filter(x => x.father === r.id || x.mother === r.id);
const siblingsOf = r => rulers.filter(x => x.id !== r.id && ((r.father && x.father === r.father) || (r.mother && x.mother === r.mother)));
function setSpouse(r, id){
  const old = spouseOf(r);
  if (old && old.id !== id){ if (old.spouse === r.id) old.spouse = ''; }
  r.spouse = id;
  if (!id) return;
  const n = rulerById(id); if (!n) return;
  const prev = spouseOf(n);
  if (prev && prev.id !== r.id && prev.spouse === n.id) prev.spouse = '';
  n.spouse = r.id;
}
function familyHtml(r){
  const rows = [];
  const add = (label, list) => { if (list.length) rows.push(`<div><span>${label}</span>${pills(list.map(rlink))}</div>`); };
  const sp = spouseOf(r), fa = rulerById(r.father), mo = rulerById(r.mother), he = rulerById(r.heir);
  add('Padre', fa ? [fa] : []); add('Madre', mo ? [mo] : []); add('Cónyuge', sp ? [sp] : []);
  add('Hermanos', siblingsOf(r).sort(byBirth)); add('Hijos', childrenOf(r).sort(byBirth));
  add('Heredero', he ? [he] : []); add('Heredero de', rulers.filter(x => x.heir === r.id));
  if (!rows.length) return '';
  return `<h3>Familia</h3><div class="fam">${rows.join('')}</div>
    <div class="treebtn"><button class="btn" id="shTree">Ver árbol genealógico</button></div>`;
}
function familyRows(f){
  const sp = spouseOf(f), father = rulerById(f.father), mother = rulerById(f.mother);
  const kids = childrenOf(f).sort(byBirth);
  const rows = [
    [father && rulerById(father.father), father && rulerById(father.mother), mother && rulerById(mother.father), mother && rulerById(mother.mother)],
    [father, mother],
    [...siblingsOf(f).sort(byBirth), f, sp],
    kids,
    kids.flatMap(k => childrenOf(k).sort(byBirth))
  ];
  const seen = new Set();
  return rows.map(row => row.filter(x => x && !seen.has(x.id) && seen.add(x.id))).filter(row => row.length);
}
function renderTree(f){
  const rows = familyRows(f);
  const yrs = r => `${r.birth ? r.birth.y : '?'}${r.dead ? ' – ' + (r.death ? r.death.y : '?') : ''}`;
  sheet.innerHTML = `${navBtns()}<h2>Árbol de ${esc(f.name)}</h2>
    <div class="sub">Hasta dos generaciones hacia arriba y hacia abajo. Haz clic en una persona para abrir su ficha.</div>
    <div class="treewrap"><div class="tree" id="tree"><svg id="treeSvg"></svg>
    ${rows.map(row => `<div class="trow">${row.map(r => `<button class="tn${r.id === f.id ? ' focus' : ''}${r.dead ? ' dead' : ''}" data-id="${esc(r.id)}"><b>${esc(r.name)}</b><span>${esc(r.house) || '&nbsp;'}</span><em>${yrs(r)}</em></button>`).join('')}</div>`).join('')}
    </div></div>`;
  bindNav();
  sheet.querySelectorAll('.tn').forEach(b => b.onclick = () => openSheet({type:'ruler', id:b.dataset.id}));
  drawTree();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (sheetView && sheetView.type === 'tree') drawTree(); });
}
function drawTree(){
  const tree = $('#tree'), sv = $('#treeSvg');
  if (!tree || !sv) return;
  const tr = tree.getBoundingClientRect(), P = {};
  tree.querySelectorAll('.tn').forEach(el => {
    const b = el.getBoundingClientRect();
    P[el.dataset.id] = {cx:b.left-tr.left+b.width/2, l:b.left-tr.left, r:b.right-tr.left, top:b.top-tr.top, bot:b.bottom-tr.top, mid:b.top-tr.top+b.height/2};
  });
  sv.setAttribute('width', tree.scrollWidth); sv.setAttribute('height', tree.scrollHeight);
  let d = '', marr = ''; const pairs = new Set();
  const pair = (a, b) => {
    const k = [a.id, b.id].sort().join('|'); if (pairs.has(k)) return; pairs.add(k);
    const A = P[a.id], B = P[b.id], L = A.cx < B.cx ? A : B, R = A.cx < B.cx ? B : A;
    marr += `M${L.r} ${L.mid}H${R.l}`;
  };
  rulers.forEach(p => {
    if (!P[p.id]) return;
    const sp = spouseOf(p);
    if (sp && P[sp.id] && Math.abs(P[sp.id].mid - P[p.id].mid) < 2) pair(p, sp);
    const par = [rulerById(p.father), rulerById(p.mother)].filter(x => x && P[x.id]);
    if (!par.length) return;
    let ax, ay, by;
    if (par.length === 2 && Math.abs(P[par[0].id].mid - P[par[1].id].mid) < 2){
      pair(par[0], par[1]);
      ax = (P[par[0].id].cx + P[par[1].id].cx) / 2; ay = P[par[0].id].mid; by = P[par[0].id].bot;
    } else { const A = P[par[0].id]; ax = A.cx; ay = A.bot; by = A.bot; }
    const C = P[p.id], bus = (by + C.top) / 2;
    d += `M${ax} ${ay}V${bus}H${C.cx}V${C.top}`;
  });
  sv.innerHTML = `<path class="desc" d="${d}"/><path class="marr" d="${marr}"/>`;
}
window.addEventListener('resize', () => { if (sheetView && sheetView.type === 'tree') drawTree(); });

const META_KEY = CONFIG.storageKey + '-meta', BK_KEY = CONFIG.storageKey + '-backups';
const readMeta = () => { try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch(e){ return {}; } };
const writeMeta = o => { try { localStorage.setItem(META_KEY, JSON.stringify(o)); } catch(e){} };
let meta = readMeta(), sessionSnap = false;
const hhmm = t => new Date(t).toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'});
function updateSaveState(){
  const el = $('#saveState'); if (!el) return;
  el.hidden = !editing;
  if (!editing) return;
  el.className = 'savestate ' + (meta.dirty ? 'dirty' : '');
  el.textContent = meta.dirty ? 'Sin descargar' : (meta.lastExport ? 'Descargado a las ' + hhmm(meta.lastExport) : 'Sin cambios');
  el.title = meta.dirty ? 'Hay cambios que no están en el markers.json que descargaste. Usa ⋯ → Descargar markers.json.' : '';
}
function readBackups(){ try { return JSON.parse(localStorage.getItem(BK_KEY)) || []; } catch(e){ return []; } }
function pushBackup(label){
  let list = readBackups();
  const data = payload();
  if (list.length && list[0].data === data) return;
  list.unshift({t:Date.now(), label, data}); list = list.slice(0, 8);
  for (let i = 0; i < 3 && list.length; i++){
    try { localStorage.setItem(BK_KEY, JSON.stringify(list)); return; } catch(e){ list.pop(); }
  }
}
function maybeBackup(){
  const now = Date.now();
  if (meta.lastSnap && now - meta.lastSnap < 10*60*1000) return;
  pushBackup('automática'); meta.lastSnap = now; writeMeta(meta);
}
function markExported(){
  meta.dirty = false; meta.lastExport = Date.now(); writeMeta(meta);
  pushBackup('al descargar'); updateSaveState();
}
window.addEventListener('beforeunload', e => { if (CONFIG.editable && editing && meta.dirty){ e.preventDefault(); e.returnValue = ''; } });
function renderBackups(){
  const list = readBackups();
  sheet.innerHTML = `${navBtns()}<h2>Copias de seguridad</h2>
    <small style="display:block;margin:8px 0 12px;color:#8f876f">Se guardan en este navegador: una al empezar a editar, otra cada 10 minutos de edición y otra cada vez que descargas. Se conservan las últimas 8. No sustituyen a descargar tu markers.json.</small>
    <div id="bkList">${list.length ? '' : '<p class="empty">Todavía no hay copias.</p>'}</div>`;
  const box = $('#bkList');

/* ---------- barony colours follow their county ---------- */
function hexToHsl(hex){
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b); let h = 0, s = 0; const l = (mx+mn)/2;
  if (mx !== mn){
    const d = mx - mn; s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx === r ? (g-b)/d + (g < b ? 6 : 0) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4; h *= 60;
  }
  return [h, s, l];
}
function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2*l - 1)) * s, x = c * (1 - Math.abs((h/60) % 2 - 1)), m = l - c/2;
  const [r,g,b] = h < 60 ? [c,x,0] : h < 120 ? [x,c,0] : h < 180 ? [0,c,x] : h < 240 ? [0,x,c] : h < 300 ? [x,0,c] : [c,0,x];
  return '#' + [r,g,b].map(v => Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}
const parentCounty = r => r.parent ? regions.find(x => x.id === r.parent && x.layer === 'county') : null;
function regionColor(r){
  const c = r.layer === 'barony' ? parentCounty(r) : null;
  if (!c) return r.color;
  const sibs = regions.filter(x => x.layer === 'barony' && x.parent === c.id), i = sibs.indexOf(r), n = sibs.length;
  const [h, s] = hexToHsl(c.color), t = n > 1 ? i/(n-1) : .5;
  return hslToHex(h + ((i % 3) - 1) * 8, Math.max(s, .4), .30 + t*.40);
}
function inPoly(pt, poly){
  let ins = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > pt.y) !== (yj > pt.y) && pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}
function autoCounty(points){
  const cs = regions.filter(g => g.layer === 'county');
  const c = {x:points.reduce((a,p)=>a+p[0],0)/points.length, y:points.reduce((a,p)=>a+p[1],0)/points.length};
  return cs.find(g => inPoly(c, g.points)) || cs.find(g => points.some(p => inPoly({x:p[0], y:p[1]}, g.points))) || null;
}

    markers: markers.map(m => ({id:m.id, name:m.name, type:m.type, desc:m.desc, url:m.url || '', x:r5(m.x), y:r5(m.y)})),
    regions: regions.map(r => ({id:r.id, layer:r.layer, name:r.name, holder:r.holder, desc:r.desc, url:r.url || '', parent:r.parent || '', color:r.color,
                                points:r.points.map(p => [r5(p[0]), r5(p[1])])})),
    labels: labels.map(t => ({id:t.id, text:t.text, style:t.style, color:t.color, size:t.size, rot:t.rot,
                              spacing:t.spacing, x:r5(t.x), y:r5(t.y)})),
    rulers: rulers.map(r => ({...r})),
    houses: houses.map(h => ({...h})),
    events: events.map(e => ({...e})),
    routes: routes.map(c => ({id:c.id, name:c.name, status:c.status, goods:c.goods, desc:c.desc, url:c.url || '', points:c.points.map(p => [r5(p[0]), r5(p[1])])}))
  }, null, 2);
}
function save(){
  if (!CONFIG.editable) return;
  try { localStorage.setItem(CONFIG.storageKey, payload()); } catch(e){}
  meta.dirty = true; writeMeta(meta); updateSaveState(); maybeBackup();
}
function loadText(text){
  const d = JSON.parse(text);
  const list = Array.isArray(d) ? d : d.markers;
  if (!Array.isArray(list)) throw new Error('No markers array');
  const hex = c => /^#[0-9a-f]{6}$/i.test(c) ? c : PALETTE[0];
  const nm = list.filter(m => typeof m.x === 'number' && typeof m.y === 'number').map((m,i)=>({
    id: String(m.id || 'm'+i+uid()), name: String(m.name ?? ''), type: TYPES[m.type] ? m.type : 'landmark',
    desc: String(m.desc ?? ''), url: String(m.url ?? ''), x: clamp(m.x,0,1), y: clamp(m.y,0,1)
  }));
  const nr = (d.regions || []).filter(r => Array.isArray(r.points) && r.points.length >= 3).map((r,i)=>({
    id: String(r.id || 'r'+i+uid()), layer: r.layer === 'county' ? 'county' : 'barony',
    name: String(r.name ?? ''), holder: String(r.holder ?? ''), desc: String(r.desc ?? ''), url: String(r.url ?? ''), parent: String(r.parent || ''), color: hex(r.color),
    points: r.points.map(p => [clamp(+p[0]||0,0,1), clamp(+p[1]||0,0,1)])
  }));
  const nl = (d.labels || []).map((t,i)=>({
    id: String(t.id || 't'+i+uid()), text: String(t.text ?? ''), style: t.style === 'black' ? 'black' : 'caps',
    color: ['ink','blood','light'].includes(t.color) ? t.color : 'ink',
    size: clamp(+t.size || 40, 8, 400), rot: clamp(+t.rot || 0, -180, 180), spacing: clamp(+t.spacing || 0, 0, 100),
    x: clamp(+t.x || 0,0,1), y: clamp(+t.y || 0,0,1)
  }));
  const vd = x => (x && Number.isFinite(+x.y)) ? {y:Math.round(+x.y), m:clamp(Math.round(+x.m)||1,1,12), d:clamp(Math.round(+x.d)||1,1,31)} : null;
  const nrul = (d.rulers || []).map((r,i)=>({
    id: String(r.id || 'p'+i+uid()), name: String(r.name ?? ''), title: String(r.title ?? ''), house: String(r.house ?? ''),
    birth: vd(r.birth), dead: !!r.dead, death: vd(r.death), liege: String(r.liege || ''), father: String(r.father || ''), mother: String(r.mother || ''), spouse: String(r.spouse || ''), heir: String(r.heir || ''), residence: String(r.residence || ''), portrait: String(r.portrait || ''),
    powers: String(r.powers ?? ''), rumors: String(r.rumors ?? ''), notes: String(r.notes ?? '')
  }));
  if (d.calendar && Number.isFinite(+d.calendar.y)) cal = {y:Math.round(+d.calendar.y), m:clamp(Math.round(+d.calendar.m)||1,1,12), d:clamp(Math.round(+d.calendar.d)||1,1,31)};
  const nrt = (d.routes || []).filter(c => Array.isArray(c.points) && c.points.length >= 2).map((c,i)=>({
    id: String(c.id || 'c'+i+uid()), name: String(c.name ?? ''), status: ROUTE_STATUS[c.status] ? c.status : 'abierta',
    goods: String(c.goods ?? ''), desc: String(c.desc ?? ''), url: String(c.url ?? ''),
    points: c.points.map(p => [clamp(+p[0]||0,0,1), clamp(+p[1]||0,0,1)])
  }));
  const nh = (d.houses || []).map((h,i)=>({id:String(h.id || 'h'+i+uid()), name:String(h.name ?? ''), motto:String(h.motto ?? ''), seat:String(h.seat || ''), head:String(h.head || ''), desc:String(h.desc ?? ''), url:String(h.url ?? '')}));
  const nev = (d.events || []).map((e,i)=>({id:String(e.id || 'e'+i+uid()), title:String(e.title ?? ''), kind:EVENT_KINDS[e.kind] ? e.kind : 'otro', date:vd(e.date) || {...cal}, place:String(e.place || ''), desc:String(e.desc ?? ''), url:String(e.url ?? '')}));
  markers = nm; regions = nr; labels = nl; rulers = nrul; routes = nrt; houses = nh; events = nev;
  renderDates();
}
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
$('#btnMenu').onclick = e => { e.stopPropagation(); openPop($('#menu'), $('#btnMenu')); };
$('#mExport').onclick = () => { download('markers.json', payload()); markExported(); $('#menu').hidden = true; };
$('#mExportDated').onclick = () => { download('markers-' + new Date().toISOString().slice(0,10) + '.json', payload()); $('#menu').hidden = true; };
$('#mBackups').onclick = () => { $('#menu').hidden = true; sheetView = null; sheetStack = []; openSheet({type:'backups'}); };
$('#mAuto').onclick = () => {
  $('#menu').hidden = true;
  let n = 0;
  regions.filter(g => g.layer === 'barony' && !g.parent).forEach(g => { const c = autoCounty(g.points); if (c){ g.parent = c.id; n++; } });
  save(); renderRegions(); toast(n ? `${n} vicarías asignadas a su condado` : 'No hay vicarías sin condado que se puedan asignar');
};
$('#mCopy').onclick = async () => {
  $('#menu').hidden = true;
  try { await navigator.clipboard.writeText(payload()); markExported(); toast('JSON de marcadores copiado'); }
  catch(e){ toast('El navegador bloqueó el copiado. Usa «Descargar».'); }
};
$('#mImport').onclick = () => { $('#menu').hidden = true; $('#fileJson').click(); };
$('#mImage').onclick  = () => { $('#menu').hidden = true; $('#fileImg').click(); };
$('#mDiscard').onclick = () => {
  $('#menu').hidden = true;
  try { localStorage.removeItem(CONFIG.storageKey); } catch(e){}
  loadPublished().then(()=>{ selected = null; renderAll(); buildBar(); refreshUI(); showPanel(); toast('Borrador local descartado'); });
};
$('#fileJson').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { loadText(await f.text()); save(); selected = null; renderAll(); buildBar(); refreshUI(); showPanel(); toast(`Importados: ${markers.length} marcadores, ${regions.length} regiones, ${labels.length} nombres, ${rulers.length} personajes`); }
  catch(err){ toast('Ese archivo no es un markers.json válido'); }
};
function loadImageFile(f){
  if (!f || !f.type.startsWith('image/')) return;
  mapImg.src = URL.createObjectURL(f);
}
$('#fileImg').onchange = e => { loadImageFile(e.target.files[0]); e.target.value = ''; };
$('#dropBtn').onclick = () => $('#fileImg').click();
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (!f) return;
  f.type.startsWith('image/') ? loadImageFile(f) : f.name.endsWith('.json') && f.text().then(t=>{
    try { loadText(t); save(); renderAll(); buildBar(); refreshUI(); } catch(_){ toast('markers.json no válido'); }
  });
});

async function loadPublished(){
  try {
    const r = await fetch(CONFIG.markers, {cache:'no-store'});
    if (!r.ok) throw 0;
    loadText(await r.text());
  } catch(e){ markers = []; regions = []; labels = []; rulers = []; routes = []; houses = []; events = []; }
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, actionLabel, action){
  let t = $('#toast'); if (t) t.remove();
  t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role','status');
  t.append(msg);
  if (actionLabel){
    const b = document.createElement('button'); b.textContent = actionLabel;
    b.onclick = () => { action(); t.remove(); };
    t.append(b);
  }
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 5000);
}

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e=>{
  if (sheetView){ if (e.key === 'Escape') closeSheet(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === 'Escape'){ if (draft.length) cancelDraft(); else if (tool){ tool = null; refreshUI(); } else select(null); }
  if (typing) return;
  if (e.key === 'Enter' && draft.length) finishDraft();
  if (e.key === 'Backspace' && draft.length){ e.preventDefault(); draft.pop(); renderHandles(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && editing && selected) removeItem(selected);
  if (e.key === '+' || e.key === '=') $('#zIn').click();
  if (e.key === '-') $('#zOut').click();
});

/* =========================================================
   Boot
   ========================================================= */
mapImg.onload = () => {
  iw = mapImg.naturalWidth; ih = mapImg.naturalHeight;
  world.style.width = iw+'px'; world.style.height = ih+'px';
  $('#drop').hidden = true;
  fit(); renderAll();
};
mapImg.onerror = () => {
  $('#dropName').textContent = CONFIG.image;
  $('#drop').hidden = false;
};

(async function boot(){
  await loadPublished();
  if (CONFIG.editable){
    try {
      const draft = localStorage.getItem(CONFIG.storageKey);
      if (draft){ loadText(draft); toast(meta.dirty ? 'Se cargó tu borrador local (tiene cambios sin descargar)' : 'Se cargó tu borrador local'); }
    } catch(e){}
  }
  buildBar(); refreshUI(); renderDates();
  mapImg.src = CONFIG.image;
})();
</script>
